[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
optimizer = true
optimizer_runs = 200
solc_version = "0.8.28"
via_ir = false

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
anvil     = "http://127.0.0.1:8545"
bnb_testnet = "${BNB_TESTNET_RPC_URL}"

[etherscan]
# bscscan API key used for --verify on BNB Testnet (chain id 97)
bnb_testnet = { key = "${BSCSCAN_API_KEY}", url = "https://api-testnet.bscscan.com/api", chain = 97 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
